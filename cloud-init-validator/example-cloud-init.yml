#cloud-config

# cloud-init Config | Example Ubuntu 25.10 Instance for User with `bash`
#
# Note that the first line of the file should be: `#cloud-config`, otherwise you will
# get an invalid "user-data" error with no other help.
#
# References:
#   - https://cloudinit.readthedocs.io/en/latest/reference/examples.html

groups: [test, testuser]
users:
  - name: "testuser"
    gecos: "Test E. User"
    homedir: "/home/testuser"
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    primary_group: testuser
    groups: [root, test]
    lock_passwd: true                   # Defaults to true. Lock the password to disable password login
    no_create_home: false               # When set to true, do not create home directory.
    no_user_group: false                # When set to true, do not create a group named after the user.
    no_log_init: false                  # When set to true, do not initialize lastlog and faillog database.
    ssh_redirect_user: false
    system: false                       # Create the user as a system user. This means no home directory.
ssh:
  emit_keys_to_console: false
package_update: true
package_upgrade: true
package_reboot_if_required: true
packages:
  - git
  - bash
  - gcc
  - readline
